# 复制为 connections.properties 后填写（勿提交真实密码）
# 用于 scripts/datax/render-and-run.ps1 渲染作业 JSON

SRC_JDBC=jdbc:mysql://源主机:3306/gcoll_aux?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&yearIsDateType=false&zeroDateTimeBehavior=convertToNull
SRC_USER=你的源库用户
SRC_PASSWORD=你的源库密码

TGT_JDBC=jdbc:mysql://目标主机:3306/prd_gcoll_aux?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&yearIsDateType=false&zeroDateTimeBehavior=convertToNull
TGT_USER=你的目标库用户
TGT_PASSWORD=你的目标库密码

# DataX 安装目录（含 bin/datax.py）
DATAX_HOME=D:/datax

# 通道数（大表可 8～16；视目标库压力调整）
CHANNEL=8

# 清表策略（写入 DataX preSql）：
#   TRUNCATE — 需 DDL（最快）
#   DELETE   — 多条 DELETE … LIMIT（见 DELETE_LIMIT / ESTIMATED_ROWS；禁止整表 DELETE）
#   NONE     — 不清空（建议配合 WRITE_MODE=replace）
CLEAR_MODE=DELETE

# DELETE 模式：每批 LIMIT，以及按估算行数生成批次数（+5 安全批，上限 2000）
DELETE_LIMIT=50000
ESTIMATED_ROWS=10000000

# 写入模式：insert（普通插入）/ replace（REPLACE INTO，冲突覆盖）
WRITE_MODE=insert
