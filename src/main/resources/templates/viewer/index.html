<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据浏览 - 数据库比对工具</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:src="@{/js/jquery.min.js}"></script>
    <style>
        /* 全屏工作区：分页始终在初屏底部可见，表体内部滚动 */
        html, body.viewer-page { height: 100%; }
        body.viewer-page {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--color-bg, #f1f5f9);
        }
        body.viewer-page > .navbar { flex-shrink: 0; }
        body.viewer-page .toast-container { z-index: 2000; }

        .viewer-shell {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0.5rem 0.85rem 0.65rem;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .viewer-layout {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
            margin: 0;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .sidebar .sb-header {
            padding: 10px 14px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            font-size: .82rem;
            color: #475569;
            background: #f8fafc;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .sidebar .sb-header .sb-title { display: flex; align-items: center; gap: 8px; }
        .tbl-check, .row-check, .th-check {
            width: 14px;
            height: 14px;
            accent-color: #4f46e5;
            cursor: pointer;
            flex-shrink: 0;
        }
        .tbl-item.checked { background: #eef2ff; }
        .data-table tbody tr.row-selected td { background: #eef2ff; }
        .data-table tbody tr { cursor: context-menu; }
        .ctx-menu {
            position: fixed;
            z-index: 2100;
            min-width: 188px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, .16);
            padding: 6px 0;
            display: none;
        }
        .ctx-menu button {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: none;
            padding: 7px 14px;
            font-size: .8rem;
            color: #334155;
            cursor: pointer;
        }
        .ctx-menu button:hover { background: #eef2ff; color: #4f46e5; }
        .ctx-menu .ctx-sep { height: 1px; background: #e2e8f0; margin: 4px 0; }
        .export-modal-backdrop {
            position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 2200; display: none;
        }
        .export-modal {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
            z-index: 2201; width: min(460px, calc(100% - 24px));
            background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
            display: none; flex-direction: column; overflow: hidden;
        }
        .export-modal.show, .export-modal-backdrop.show { display: flex; }
        .export-modal-backdrop.show { display: block; }
        .export-modal .em-hd {
            padding: 14px 18px; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center; font-weight: 700;
        }
        .export-modal .em-bd { padding: 16px 18px; font-size: .84rem; }
        .export-modal .em-ft {
            padding: 12px 18px; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: flex-end; gap: 8px; background: #f8fafc;
        }
        .export-modal label.em-label { display: block; font-size: .75rem; color: #64748b; margin: 10px 0 4px; }
        .export-modal .em-kind { display: flex; gap: 12px; flex-wrap: wrap; }
        .export-modal .em-tables { max-height: 120px; overflow: auto; background: #f8fafc; border-radius: 8px; padding: 8px 10px; font-size: .75rem; color: #475569; }
        .sidebar .sb-body { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; }
        .sidebar .sb-body .tbl-item {
            padding: 7px 14px;
            cursor: pointer;
            font-size: .8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background .12s;
            border-left: 3px solid transparent;
            color: #475569;
        }
        .sidebar .sb-body .tbl-item:hover { background: #f1f5f9; color: #1e293b; }
        .sidebar .sb-body .tbl-item.active {
            background: #eef2ff;
            border-left-color: #4f46e5;
            color: #4f46e5;
            font-weight: 600;
        }
        .sidebar .sb-body .tbl-item .tbl-icon { font-size: .9rem; width: 18px; text-align: center; }
        .sidebar .sb-body .tbl-search { padding: 6px 12px 10px; }
        .sidebar .sb-body .tbl-search input {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: .8rem;
            outline: none;
            transition: border .15s;
        }
        .sidebar .sb-body .tbl-search input:focus { border-color: #4f46e5; }
        .sidebar .sb-footer {
            padding: 8px 14px;
            border-top: 1px solid #e2e8f0;
            font-size: .7rem;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .schema-selector {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
            background: #fafbfc;
            flex-shrink: 0;
        }
        .schema-selector select {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: .78rem;
            outline: none;
            color: #475569;
            background: #fff;
        }
        .schema-selector select:focus { border-color: #4f46e5; }
        .schema-selector .schema-label {
            font-size: .68rem;
            color: #94a3b8;
            margin-bottom: 4px;
            display: block;
        }

        .main-area {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: var(--shadow-sm, var(--shadow-md));
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar .tb-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .toolbar .tb-right { display: flex; align-items: center; gap: 8px; }
        .tb-title { font-weight: 800; font-size: .92rem; color: #1e293b; white-space: nowrap; margin-right: 4px; }
        .tb-ds { font-weight: 700; font-size: .85rem; color: #1e293b; white-space: nowrap; }
        .tb-table {
            font-size: .82rem;
            color: #4f46e5;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .tb-rowcount { font-size: .75rem; color: #94a3b8; white-space: nowrap; }

        .mode-tabs { display: flex; gap: 0; }
        .mode-tab {
            padding: 5px 14px;
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #64748b;
            transition: all .15s;
        }
        .mode-tab:first-child { border-radius: 8px 0 0 8px; }
        .mode-tab:last-child { border-radius: 0 8px 8px 0; }
        .mode-tab.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }

        .sql-editor {
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow-sm, var(--shadow-md));
            overflow: hidden;
            flex-shrink: 0;
        }
        .sql-editor .se-header {
            padding: 8px 14px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            font-size: .8rem;
            color: #475569;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sql-editor textarea {
            width: 100%;
            border: none;
            padding: 10px 14px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: .82rem;
            resize: vertical;
            min-height: 56px;
            max-height: 140px;
            outline: none;
            color: #1e293b;
            line-height: 1.5;
        }
        .sql-editor .se-footer {
            padding: 6px 14px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafbfc;
        }
        .sql-editor .se-hint { font-size: .7rem; color: #94a3b8; }

        .data-panel {
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .data-panel .dp-header {
            padding: 8px 14px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            flex-shrink: 0;
        }
        .data-panel .dp-header .dp-title { font-weight: 700; font-size: .8rem; color: #475569; }
        .data-panel .dp-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
        .data-table thead { position: sticky; top: 0; z-index: 2; }
        .data-table thead th {
            background: #f1f5f9;
            color: #475569;
            font-weight: 700;
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .3px;
            padding: 7px 10px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }
        .data-table thead th.pk-col { color: #4f46e5; }
        .data-table thead th.pk-col::after { content: ' PK'; font-size: .6rem; opacity: .6; }
        .data-table tbody td {
            padding: 6px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: .76rem;
        }
        .data-table tbody tr:hover td { background: #f8fafc; }
        .data-table tbody td.null-val { color: #94a3b8; font-style: italic; }

        .data-panel .dp-footer {
            padding: 8px 14px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafbfc;
            font-size: .78rem;
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pagination-info { color: #64748b; }
        .pagination-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .page-btn {
            padding: 4px 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: .75rem;
            color: #475569;
            transition: all .12s;
        }
        .page-btn:hover:not(:disabled) { background: #eef2ff; border-color: #4f46e5; color: #4f46e5; }
        .page-btn:disabled { opacity: .4; cursor: default; }
        .page-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
        .page-input {
            width: 44px;
            text-align: center;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 4px;
            font-size: .75rem;
            outline: none;
        }
        .page-input:focus { border-color: #4f46e5; }

        .empty-state-viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 40px 20px;
            color: #94a3b8;
            box-sizing: border-box;
        }
        .empty-state-viewer .es-icon { font-size: 2.4rem; margin-bottom: 10px; }
        .empty-state-viewer h5 { color: #64748b; margin-bottom: 4px; }

        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 40px;
        }
        .spinner-ring {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px 16px;
            color: #991b1b;
            font-size: .82rem;
            margin: 12px 16px;
        }

        @media (max-width: 900px) {
            body.viewer-page { overflow: auto; }
            .viewer-layout { flex-direction: column; }
            .sidebar { width: 100%; max-height: 220px; }
            .data-panel { min-height: 50vh; }
        }
    </style>
</head>
<body class="viewer-page">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #4f46e5, #6366f1);">
        <div class="app-container d-flex align-items-center justify-content-between w-100" style="max-width:none;padding-left:0.85rem;padding-right:0.85rem;">
            <a class="navbar-brand" href="/"><span style="font-size:1.3rem;">&#9670;</span> 数据库比对工具</a>
            <div class="d-flex align-items-center gap-1">
                <a class="nav-link text-white" href="/datasource/list">数据源管理</a>
                <a class="nav-link text-white" href="/compare/config">比对任务</a>
                <a class="nav-link text-white" href="/sync/list">同步任务</a>
                <a class="nav-link text-white" href="/report/list">比对报告</a>
                <a class="nav-link text-white active" href="/viewer">数据浏览</a>
                <a class="nav-link text-white" href="/cleanup">C盘清理</a>
                <a class="nav-link text-white" href="/settings">参数设置</a>
                <a class="nav-link text-white" href="/logout" title="退出登录">退出</a>
            </div>
        </div>
    </nav>

    <div class="toast-container" id="toastContainer"></div>

    <div class="viewer-shell">
        <div class="viewer-layout">
            <!-- 左侧边栏 -->
            <div class="sidebar">
                <div class="sb-header">
                    <span class="sb-title">
                        <input type="checkbox" class="tbl-check" id="chkAllTables" title="全选当前列表" onclick="toggleSelectAllTables(this)">
                        &#128451; 数据源 &amp; 表列表
                    </span>
                    <button type="button" class="page-btn" onclick="openExportModal('BOTH', 'tables')" title="导出勾选表">导出</button>
                </div>
                <div class="schema-selector" id="schemaSelector" style="display:none;">
                    <span class="schema-label">数据库 / 模式</span>
                    <select id="schemaSelect" onchange="onSchemaChange()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="sb-body" id="sidebarBody">
                    <div class="tbl-search">
                        <input type="text" id="tableSearch" placeholder="&#128269; 搜索表名..." oninput="filterTables()">
                    </div>
                    <div id="tableListWrap">
                        <div class="empty-state-viewer" style="padding:30px 10px;"
                             th:if="${dataSources == null or #lists.isEmpty(dataSources)}">
                            <p style="font-size:.78rem;margin-bottom:8px;">暂无数据源</p>
                            <p style="font-size:.75rem;margin:0;"><a href="/datasource/list">去数据源管理添加</a></p>
                        </div>
                        <div class="empty-state-viewer" style="padding:30px 10px;" th:unless="${dataSources == null or #lists.isEmpty(dataSources)}">
                            <p style="font-size:.78rem;margin:0;">请选择数据源</p>
                        </div>
                    </div>
                </div>
                <div class="sb-footer">
                    数据源 <strong id="sbDsName">-</strong> | <span id="sbTableCount">0</span> 张表
                </div>
            </div>

            <!-- 右侧主区域 -->
            <div class="main-area">
                <!-- 工具栏（标题并入，去掉大 page-header） -->
                <div class="toolbar">
                    <div class="tb-left">
                        <span class="tb-title">数据浏览</span>
                        <select class="form-select form-select-sm" id="dsSelect" onchange="onDsChange()" style="width:180px;font-size:.82rem;">
                            <option value="">选择数据源...</option>
                            <option th:each="ds : ${dataSources}" th:value="${ds.id}" th:text="${ds.name}"
                                    th:attr="data-db-type=${ds.dbType}"></option>
                        </select>
                        <span class="tb-table" id="currentTableLabel" style="display:none;"></span>
                        <span class="tb-rowcount" id="rowCountLabel" style="display:none;"></span>
                    </div>
                    <div class="tb-right">
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="openExportModal('BOTH', 'tables')">导出 SQL</button>
                        <div class="mode-tabs">
                            <div class="mode-tab active" onclick="switchMode('browse', this)">浏览模式</div>
                            <div class="mode-tab" onclick="switchMode('sql', this)">SQL 模式</div>
                        </div>
                    </div>
                </div>

                <!-- SQL 编辑器（SQL 模式） -->
                <div class="sql-editor" id="sqlEditor" style="display:none;">
                    <div class="se-header">
                        <span>&#9000; SQL 查询</span>
                        <span class="se-hint" id="sqlHint"></span>
                    </div>
                    <textarea id="sqlInput" placeholder="SELECT * FROM table_name WHERE ...&#10;-- 仅支持 SELECT 查询，暂不支持多条语句"></textarea>
                    <div class="se-footer">
                        <span class="se-hint" id="sqlError" style="color:#dc2626;display:none;"></span>
                        <button class="btn btn-primary btn-sm" onclick="runSqlQuery()">&#9654; 执行查询</button>
                    </div>
                </div>

                <!-- 数据面板：表体滚动，底部分页固定可见 -->
                <div class="data-panel">
                    <div class="dp-header">
                        <span class="dp-title" id="dpTitle">请选择数据源和表</span>
                        <span class="dp-title" style="font-weight:400;font-size:.72rem;color:#64748b;" id="dpInfo"></span>
                    </div>
                    <div class="dp-body" id="dataBody">
                        <div class="empty-state-viewer">
                            <span class="es-icon">&#128451;</span>
                            <h5>暂无数据</h5>
                            <p style="font-size:.82rem;">选择数据源和表后开始浏览</p>
                        </div>
                    </div>
                    <div class="dp-footer" id="dataFooter">
                        <div class="pagination-info" id="paginationInfo">共 0 条</div>
                        <div class="pagination-controls">
                            <label style="font-size:.75rem;color:#64748b;margin-right:4px;">每页</label>
                            <select class="page-btn" id="pageSizeSelect" onchange="onPageSizeChange()" style="padding:4px 6px;">
                                <option value="20">20</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="200">200</option>
                            </select>
                            <button class="page-btn" id="btnFirst" onclick="goPage(1)" disabled>&#171;</button>
                            <button class="page-btn" id="btnPrev" onclick="goPage(currentPage-1)" disabled>&#8249;</button>
                            <input type="text" class="page-input" id="pageInput" value="1">
                            <span style="font-size:.75rem;color:#64748b;">/ <span id="totalPagesLabel">1</span></span>
                            <button class="page-btn" id="btnNext" onclick="goPage(currentPage+1)" disabled>&#8250;</button>
                            <button class="page-btn" id="btnLast" onclick="goPage(totalPages)" disabled>&#187;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </div>

    <div class="ctx-menu" id="tableCtxMenu">
        <button type="button" onclick="ctxExport('DDL')">导出 DDL</button>
        <button type="button" onclick="ctxExport('DML')">导出 DML</button>
        <button type="button" onclick="ctxExport('BOTH')">导出 DDL + DML</button>
    </div>
    <div class="ctx-menu" id="rowCtxMenu">
        <button type="button" onclick="ctxExportRows()">导出选中行 DML</button>
        <div class="ctx-sep"></div>
        <button type="button" onclick="ctxExportCurrentTable('DML')">导出本表全部 DML</button>
        <button type="button" onclick="ctxExportCurrentTable('DDL')">导出本表 DDL</button>
        <button type="button" onclick="ctxExportCurrentTable('BOTH')">导出本表 DDL + DML</button>
    </div>
    <div class="export-modal-backdrop" id="exportBackdrop" onclick="closeExportModal()"></div>
    <div class="export-modal" id="exportModal" role="dialog" aria-modal="true">
        <div class="em-hd">
            <span>导出 SQL</span>
            <button type="button" class="page-btn" onclick="closeExportModal()">关闭</button>
        </div>
        <div class="em-bd">
            <label class="em-label">导出内容</label>
            <div class="em-kind">
                <label><input type="radio" name="exportKind" value="DDL"> DDL</label>
                <label><input type="radio" name="exportKind" value="DML"> DML</label>
                <label><input type="radio" name="exportKind" value="BOTH" checked> DDL + DML</label>
            </div>
            <label class="em-label">目标数据库方言（默认：当前数据源）</label>
            <select class="form-select form-select-sm" id="exportDialect"></select>
            <label class="em-label" style="display:flex;align-items:center;gap:6px;margin-top:12px;">
                <input type="checkbox" id="exportIncludeDrop"> 导出前包含 DROP TABLE
            </label>
            <label class="em-label">范围</label>
            <div class="em-tables" id="exportScopeHint"></div>
        </div>
        <div class="em-ft">
            <button type="button" class="btn btn-light btn-sm" onclick="closeExportModal()">取消</button>
            <button type="button" class="btn btn-primary btn-sm" id="btnDoExport" onclick="doExport()">下载 .sql</button>
        </div>
    </div>

    <script th:inline="javascript">
        var currentDsId = null;
        var currentCatalog = null;  // MySQL: 数据库名
        var currentSchema = null;   // PG/Oracle/SQLServer: schema
        var currentTable = null;
        var currentMode = 'browse'; // 'browse' | 'sql'
        var currentPage = 1;
        var totalPages = 1;
        var currentPageSize = 50;
        var allTables = [];
        var allSchemas = [];
        var columnInfo = {}; // key: catalog|schema|tableName -> [{name,type,size,nullable,isPk}]
        var currentDbType = '';
        var lastDataColumns = [];
        var lastDataRows = [];
        var exportCtx = { mode: 'tables', kind: 'BOTH', tables: [], rows: null };
        var dialectOptions = [];
        var ctxTableName = null;

        function columnCacheKey() {
            return (currentCatalog || '') + '|' + (currentSchema || '') + '|' + (currentTable || '');
        }

        $(function() {
            $('#sqlInput').on('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 13) {
                    runSqlQuery();
                }
            });
            $('#pageInput').on('keydown', function(e) {
                if (e.keyCode === 13) {
                    var p = parseInt($(this).val());
                    if (p >= 1 && p <= totalPages) { goPage(p); }
                }
            });
            $(document).on('click', hideCtxMenus);
            loadDialects();
            if (!$('#dsSelect').val()) {
                resetViewer();
            }
        });

        // ===== 数据源切换 =====
        function onDsChange() {
            var dsId = $('#dsSelect').val();
            if (!dsId) {
                resetViewer();
                return;
            }
            currentDsId = dsId;
            var dsName = $('#dsSelect option:selected').text();
            currentDbType = $('#dsSelect option:selected').attr('data-db-type') || '';
            $('#sbDsName').text(dsName);
            currentCatalog = null;
            currentSchema = null;
            currentTable = null;
            currentPage = 1;
            clearDataPanel();
            loadSchemas(dsId);
        }

        // ===== Schema 列表 =====
        function loadSchemas(dsId) {
            $('#tableListWrap').html('<div style="padding:16px;text-align:center;"><div class="spinner-ring mx-auto mb-2" style="width:20px;height:20px;border-width:2px;"></div><span style="font-size:.78rem;color:#94a3b8;">加载数据库列表...</span></div>');
            $.get('/viewer/schemas/' + dsId, function(res) {
                if (res.success) {
                    allSchemas = res.schemas || [];
                    if (res.dbType) currentDbType = res.dbType;
                    renderSchemaSelector(allSchemas, res.defaultSchema);
                    // 自动选择默认/第一个 schema
                    if (allSchemas.length > 0) {
                        var selIdx = 0;
                        for (var i = 0; i < allSchemas.length; i++) {
                            if (allSchemas[i].isDefault || allSchemas[i].name === res.defaultSchema) { selIdx = i; break; }
                        }
                        $('#schemaSelect').prop('selectedIndex', selIdx + 1); // +1 因为「全部」占第0项
                        applySchemaSelection();
                    } else {
                        loadTables(dsId, null, null);
                    }
                } else {
                    $('#tableListWrap').html('<div style="padding:16px;color:#dc2626;font-size:.8rem;">获取数据库列表失败: ' + (res.msg || '未知错误') + '</div>');
                }
            }).fail(function() {
                $('#tableListWrap').html('<div style="padding:16px;color:#dc2626;font-size:.8rem;">请求失败</div>');
            });
        }

        function renderSchemaSelector(schemas, defaultSchema) {
            if (!schemas || schemas.length <= 1) {
                $('#schemaSelector').hide();
                return;
            }
            $('#schemaSelector').show();
            var html = '<span class="schema-label">数据库 / 模式 (' + schemas.length + '个)</span>';
            html += '<select id="schemaSelect" onchange="onSchemaChange()">';
            html += '<option value="">全部</option>';
            schemas.forEach(function(s) {
                var label = s.name;
                if (s.isDefault) label += ' (默认)';
                html += '<option value="' + escHtml(s.name) + '" data-type="' + (s.type || 'schema') + '">' + escHtml(label) + '</option>';
            });
            html += '</select>';
            $('#schemaSelector').html(html);
        }

        function onSchemaChange() {
            applySchemaSelection();
        }

        function applySchemaSelection() {
            var val = $('#schemaSelect').val();
            var opt = $('#schemaSelect option:selected');
            if (!val) {
                // 选择了「全部」
                currentCatalog = null;
                currentSchema = null;
            } else {
                var type = opt.data('type') || 'schema';
                if (type === 'catalog') {
                    currentCatalog = val;
                    currentSchema = null;
                } else {
                    currentSchema = val;
                    currentCatalog = null;
                }
            }
            currentTable = null;
            currentPage = 1;
            $('#currentTableLabel').hide();
            $('#rowCountLabel').hide();
            clearDataPanel();
            loadTables(currentDsId, currentCatalog, currentSchema);
        }

        // ===== 加载表列表 =====
        function loadTables(dsId, catalog, schema) {
            $('#tableListWrap').html('<div style="padding:16px;text-align:center;"><div class="spinner-ring mx-auto mb-2" style="width:20px;height:20px;border-width:2px;"></div><span style="font-size:.78rem;color:#94a3b8;">加载表列表...</span></div>');
            $.get('/viewer/tables/' + dsId, {
                catalog: catalog || '',
                schema: schema || ''
            }, function(res) {
                if (res.success) {
                    allTables = res.tables || [];
                    $('#sbTableCount').text(allTables.length);
                    renderTableList(allTables);
                    // 切换库后，带着搜索框文字联动过滤
                    filterTables();
                } else {
                    $('#tableListWrap').html('<div style="padding:16px;color:#dc2626;font-size:.8rem;">加载失败: ' + (res.msg || '未知错误') + '</div>');
                }
            }).fail(function() {
                $('#tableListWrap').html('<div style="padding:16px;color:#dc2626;font-size:.8rem;">请求失败</div>');
            });
        }

        function renderTableList(tables) {
            if (!tables || tables.length === 0) {
                $('#tableListWrap').html('<div style="padding:16px;text-align:center;color:#94a3b8;font-size:.8rem;">该模式下暂无表</div>');
                return;
            }
            var html = '';
            tables.forEach(function(t) {
                var icon = t.type === 'VIEW' ? '&#128065;' : '&#128451;';
                html += '<div class="tbl-item" data-table="' + escHtml(t.name) + '"'
                    + ' data-catalog="' + escHtml(t.catalog || '') + '"'
                    + ' data-schema="' + escHtml(t.schema || '') + '"'
                    + ' oncontextmenu="onTableContextMenu(event, this)"'
                    + ' onclick="selectTable(\'' + escJs(t.name) + '\', this)">'
                    + '<input type="checkbox" class="tbl-check" onclick="onTableCheckClick(event, this)">'
                    + '<span class="tbl-icon">' + icon + '</span>'
                    + '<span>' + escHtml(t.name) + '</span>'
                    + '</div>';
            });
            $('#tableListWrap').html(html);
            syncSelectAllCheckbox();
        }

        function filterTables() {
            var kw = $('#tableSearch').val().toLowerCase();
            $('#tableListWrap .tbl-item').each(function() {
                var name = ($(this).data('table') || '').toLowerCase();
                $(this).toggle(name.indexOf(kw) >= 0);
            });
            syncSelectAllCheckbox();
        }

        // ===== 选择表 =====
        function selectTable(tableName, el) {
            currentTable = tableName;
            currentPage = 1;
            $('#tableListWrap .tbl-item').removeClass('active');
            $(el).addClass('active');
            $('#currentTableLabel').text('📋 ' + tableName).show();

            loadTableData();
            loadColumns();
        }

        function loadColumns() {
            if (!currentDsId || !currentTable) return;
            var key = columnCacheKey();
            if (columnInfo[key]) return;
            $.get('/viewer/columns/' + currentDsId + '?table=' + encodeURIComponent(currentTable)
                + '&catalog=' + encodeURIComponent(currentCatalog || '')
                + '&schema=' + encodeURIComponent(currentSchema || ''), function(res) {
                if (res.success) {
                    columnInfo[key] = res.columns;
                }
            });
        }

        function loadTableData() {
            if (!currentDsId || !currentTable) return;
            $('#dataBody').html('<div class="loading-overlay"><div class="spinner-ring"></div></div>');
            $('#dpTitle').text('📋 ' + currentTable);
            $('#dpInfo').text('');

            $.get('/viewer/table-data/' + currentDsId, {
                table: currentTable,
                page: currentPage,
                size: currentPageSize,
                catalog: currentCatalog || '',
                schema: currentSchema || ''
            }, function(res) {
                if (res.success) {
                    renderDataTable(res);
                } else {
                    $('#dataBody').html('<div class="error-box">查询失败: ' + (res.msg || '未知错误') + '</div>');
                }
            }).fail(function() {
                $('#dataBody').html('<div class="error-box">请求失败，请检查网络连接</div>');
            });
        }

        // ===== 渲染数据表格 =====
        function renderDataTable(data) {
            var columns = data.columns || [];
            var rows = data.rows || [];
            totalPages = data.totalPages || 1;

            var key = columnCacheKey();
            var cols = columnInfo[key] || [];
            var pkNames = {};
            cols.forEach(function(c) { if (c.isPk) pkNames[c.name] = true; });

            var thead = '<thead><tr>';
            thead += '<th style="width:28px;"><input type="checkbox" class="th-check" id="chkAllRows" onclick="toggleSelectAllRows(this)" title="全选本页"></th>';
            thead += '<th style="width:40px;">#</th>';
            columns.forEach(function(col) {
                thead += '<th class="' + (pkNames[col] ? 'pk-col' : '') + '">' + escHtml(col) + '</th>';
            });
            thead += '</tr></thead>';

            lastDataColumns = columns.slice();
            lastDataRows = rows;

            var tbody = '<tbody>';
            if (rows.length === 0) {
                tbody += '<tr><td colspan="' + (columns.length + 2) + '" style="text-align:center;padding:30px;color:#94a3b8;">暂无数据</td></tr>';
            } else {
                var startIdx = (currentPage - 1) * currentPageSize;
                rows.forEach(function(row, i) {
                    tbody += '<tr data-row-index="' + i + '" oncontextmenu="onRowContextMenu(event, ' + i + ')">';
                    tbody += '<td><input type="checkbox" class="row-check" onclick="onRowCheckClick(event, this)"></td>';
                    tbody += '<td style="color:#94a3b8;font-size:.72rem;width:40px;">' + (startIdx + i + 1) + '</td>';
                    row.forEach(function(val) {
                        if (val === null || val === undefined) {
                            tbody += '<td class="null-val">NULL</td>';
                        } else {
                            var display = String(val);
                            if (display.length > 200) display = display.substring(0, 200) + '...';
                            tbody += '<td title="' + escHtml(String(val)) + '">' + escHtml(display) + '</td>';
                        }
                    });
                    tbody += '</tr>';
                });
            }
            tbody += '</tbody>';

            $('#dataBody').html('<table class="data-table">' + thead + tbody + '</table>');
            $('#dataFooter').show();
            updatePagination(data);
        }

        function updatePagination(data) {
            var total = data.total || 0;
            var page = data.page || 1;
            var size = data.pageSize || currentPageSize;
            currentPage = page;
            currentPageSize = size;
            totalPages = data.totalPages || 1;

            $('#paginationInfo').text('共 ' + total.toLocaleString() + ' 条');
            $('#totalPagesLabel').text(totalPages);
            $('#pageInput').val(page);

            $('#btnFirst,#btnPrev').prop('disabled', page <= 1);
            $('#btnNext,#btnLast').prop('disabled', page >= totalPages);
            $('#dpInfo').text('第 ' + page + ' 页 / 共 ' + totalPages + ' 页');
        }

        // ===== 分页操作 =====
        function goPage(p) {
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            if (currentMode === 'sql') {
                runSqlQuery();
            } else {
                loadTableData();
            }
        }

        function onPageSizeChange() {
            currentPageSize = parseInt($('#pageSizeSelect').val());
            currentPage = 1;
            if (currentMode === 'sql') {
                runSqlQuery();
            } else {
                loadTableData();
            }
        }

        // ===== 模式切换 =====
        function switchMode(mode, btn) {
            currentMode = mode;
            $('.mode-tab').removeClass('active');
            $(btn).addClass('active');
            if (mode === 'sql') {
                $('#sqlEditor').slideDown(200);
                if (currentTable && !$('#sqlInput').val()) {
                    $('#sqlInput').val('SELECT * FROM ' + currentTable);
                }
                $('#sqlHint').text('Ctrl+Enter 执行查询');
            } else {
                $('#sqlEditor').slideUp(200);
                if (currentTable) loadTableData();
            }
        }

        // ===== SQL 查询 =====
        function runSqlQuery() {
            if (!currentDsId) { showToast('请先选择数据源', 'warning'); return; }

            var sql = $('#sqlInput').val().trim();
            if (!sql) { showToast('请输入 SQL 语句', 'warning'); return; }

            currentPage = 1;

            $('#sqlError').hide();
            $('#dataBody').html('<div class="loading-overlay"><div class="spinner-ring"></div></div>');
            $('#dpTitle').text('&#9000; SQL 查询结果');
            $('#dpInfo').text('');

            $.ajax({
                url: '/viewer/sql-query/' + currentDsId,
                type: 'POST',
                data: {
                    sql: sql,
                    page: currentPage,
                    size: currentPageSize
                },
                success: function(res) {
                    if (res.success) {
                        renderDataTable(res);
                    } else {
                        $('#dataBody').html('<div class="error-box">' + escHtml(res.msg || '查询失败') + '</div>');
                    }
                },
                error: function(xhr) {
                    var msg = '请求失败';
                    try {
                        var err = JSON.parse(xhr.responseText);
                        msg = err.msg || err.message || msg;
                    } catch(e) {}
                    $('#dataBody').html('<div class="error-box">' + escHtml(msg) + '</div>');
                }
            });
        }

        // ===== 工具函数 =====
        function resetViewer() {
            currentDsId = null;
            currentCatalog = null;
            currentSchema = null;
            currentTable = null;
            allTables = [];
            allSchemas = [];
            $('#schemaSelector').hide();
            var dsCount = $('#dsSelect option').filter(function () { return $(this).val(); }).length;
            if (dsCount === 0) {
                $('#tableListWrap').html('<div class="empty-state-viewer" style="padding:30px 10px;">'
                    + '<p style="font-size:.78rem;margin-bottom:8px;">暂无数据源</p>'
                    + '<p style="font-size:.75rem;margin:0;"><a href="/datasource/list">去数据源管理添加</a></p></div>');
            } else {
                $('#tableListWrap').html('<div class="empty-state-viewer" style="padding:30px 10px;"><p style="font-size:.78rem;">请选择数据源</p></div>');
            }
            $('#sbDsName').text('-');
            $('#sbTableCount').text('0');
            $('#currentTableLabel').hide();
            $('#rowCountLabel').hide();
            clearDataPanel();
        }

        function clearDataPanel() {
            $('#dataBody').html('<div class="empty-state-viewer"><span class="es-icon">&#128451;</span><h5>暂无数据</h5><p style="font-size:.82rem;">选择数据源和表后开始浏览</p></div>');
            $('#paginationInfo').text('共 0 条');
            $('#totalPagesLabel').text('1');
            $('#pageInput').val('1');
            $('#btnFirst,#btnPrev,#btnNext,#btnLast').prop('disabled', true);
            $('#dpTitle').text('请选择数据源和表');
            $('#dpInfo').text('');
            currentPage = 1;
            totalPages = 1;
        }

        function showToast(msg, type) {
            type = type || 'info';
            var el = $('<div class="toast-msg toast-' + type + '">' + escHtml(msg) + '</div>');
            $('#toastContainer').append(el);
            setTimeout(function() { el.fadeOut(300, function() { el.remove(); }); }, 3000);
        }

        function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function escJs(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

        function hideCtxMenus() {
            $('#tableCtxMenu,#rowCtxMenu').hide();
        }

        function loadDialects() {
            $.get('/viewer/dialects', function(res) {
                if (res.success) dialectOptions = res.dialects || [];
            });
        }

        function onTableCheckClick(e, el) {
            e.stopPropagation();
            $(el).closest('.tbl-item').toggleClass('checked', el.checked);
            syncSelectAllCheckbox();
        }

        function toggleSelectAllTables(el) {
            var visible = $('#tableListWrap .tbl-item:visible');
            visible.find('.tbl-check').prop('checked', el.checked);
            visible.toggleClass('checked', el.checked);
        }

        function syncSelectAllCheckbox() {
            var vis = $('#tableListWrap .tbl-item:visible');
            var n = vis.length;
            var c = vis.find('.tbl-check:checked').length;
            $('#chkAllTables').prop('checked', n > 0 && c === n);
        }

        function collectCheckedTables() {
            var items = [];
            $('#tableListWrap .tbl-item .tbl-check:checked').each(function() {
                var row = $(this).closest('.tbl-item');
                items.push(tableRefFromItem(row));
            });
            return items;
        }

        function tableRefFromItem(row) {
            return {
                name: String(row.data('table') || ''),
                catalog: String(row.data('catalog') || currentCatalog || ''),
                schema: String(row.data('schema') || currentSchema || '')
            };
        }

        function tableRefFromCurrent() {
            var active = $('#tableListWrap .tbl-item.active');
            if (active.length) return tableRefFromItem(active);
            return {
                name: currentTable || '',
                catalog: currentCatalog || '',
                schema: currentSchema || ''
            };
        }

        function onTableContextMenu(e, el) {
            e.preventDefault();
            e.stopPropagation();
            hideCtxMenus();
            ctxTableName = $(el).data('table');
            var $el = $(el);
            if (!$el.find('.tbl-check').prop('checked')) {
                $('#tableListWrap .tbl-check').prop('checked', false);
                $('#tableListWrap .tbl-item').removeClass('checked');
                $el.find('.tbl-check').prop('checked', true);
                $el.addClass('checked');
                syncSelectAllCheckbox();
            }
            $('#tableCtxMenu').css({ left: e.clientX + 'px', top: e.clientY + 'px' }).show();
        }

        function onRowContextMenu(e, idx) {
            e.preventDefault();
            e.stopPropagation();
            hideCtxMenus();
            var tr = $('#dataBody tbody tr[data-row-index="' + idx + '"]');
            if (tr.length && !tr.find('.row-check').prop('checked')) {
                $('#dataBody .row-check').prop('checked', false);
                $('#dataBody tbody tr').removeClass('row-selected');
                tr.find('.row-check').prop('checked', true);
                tr.addClass('row-selected');
            }
            $('#rowCtxMenu').css({ left: e.clientX + 'px', top: e.clientY + 'px' }).show();
        }

        function onRowCheckClick(e, el) {
            e.stopPropagation();
            $(el).closest('tr').toggleClass('row-selected', el.checked);
            var vis = $('#dataBody tbody tr[data-row-index]');
            var n = vis.length;
            var c = vis.find('.row-check:checked').length;
            $('#chkAllRows').prop('checked', n > 0 && c === n);
        }

        function toggleSelectAllRows(el) {
            $('#dataBody tbody tr[data-row-index] .row-check').prop('checked', el.checked);
            $('#dataBody tbody tr[data-row-index]').toggleClass('row-selected', el.checked);
        }

        function collectSelectedRowMaps() {
            var maps = [];
            $('#dataBody tbody tr[data-row-index] .row-check:checked').each(function() {
                var idx = parseInt($(this).closest('tr').data('row-index'), 10);
                var row = lastDataRows[idx];
                if (!row) return;
                var obj = {};
                lastDataColumns.forEach(function(col, i) { obj[col] = row[i]; });
                maps.push(obj);
            });
            return maps;
        }

        function ctxExport(kind) {
            hideCtxMenus();
            openExportModal(kind, 'tables');
        }

        function ctxExportCurrentTable(kind) {
            hideCtxMenus();
            if (!currentTable) { showToast('请先选择表', 'warning'); return; }
            exportCtx.tables = [tableRefFromCurrent()];
            exportCtx.rows = null;
            exportCtx.mode = 'tables';
            openExportModal(kind, 'preset');
        }

        function ctxExportRows() {
            hideCtxMenus();
            var rows = collectSelectedRowMaps();
            if (!rows.length) { showToast('请先勾选要导出的行', 'warning'); return; }
            if (!currentTable) { showToast('请先选择表', 'warning'); return; }
            exportCtx.tables = [tableRefFromCurrent()];
            exportCtx.rows = rows;
            exportCtx.mode = 'rows';
            openExportModal('DML', 'preset');
        }

        function fillDialectSelect() {
            var html = '<option value="">当前数据源（' + escHtml(currentDbType || '自身') + '）</option>';
            dialectOptions.forEach(function(d) {
                html += '<option value="' + escHtml(d.id) + '">' + escHtml(d.label) + '</option>';
            });
            $('#exportDialect').html(html);
            if (currentDbType) {
                $('#exportDialect').val('');
            }
        }

        function openExportModal(kind, mode) {
            hideCtxMenus();
            if (!currentDsId) { showToast('请先选择数据源', 'warning'); return; }
            kind = kind || 'BOTH';
            if (mode !== 'preset') {
                exportCtx.mode = mode || 'tables';
                exportCtx.rows = null;
                if (exportCtx.mode === 'tables') {
                    var checked = collectCheckedTables();
                    if (!checked.length && currentTable) checked = [tableRefFromCurrent()];
                    if (!checked.length) { showToast('请先勾选表，或打开一张表后再导出', 'warning'); return; }
                    exportCtx.tables = checked;
                }
            }
            exportCtx.kind = kind;
            $('input[name="exportKind"][value="' + kind + '"]').prop('checked', true);
            if (exportCtx.mode === 'rows') {
                $('input[name="exportKind"][value="DML"]').prop('checked', true);
                $('input[name="exportKind"]').prop('disabled', true);
                $('#exportScopeHint').text('选中 ' + (exportCtx.rows || []).length + ' 行 → ' + (exportCtx.tables[0] && exportCtx.tables[0].name));
            } else {
                $('input[name="exportKind"]').prop('disabled', false);
                var names = (exportCtx.tables || []).map(function(t) { return t.name; });
                $('#exportScopeHint').text(names.length + ' 张表：' + names.join(', '));
            }
            fillDialectSelect();
            $('#exportIncludeDrop').prop('checked', false);
            $('#exportBackdrop,#exportModal').addClass('show');
        }

        function closeExportModal() {
            $('#exportBackdrop,#exportModal').removeClass('show');
        }

        function doExport() {
            if (!currentDsId) return;
            var kind = $('input[name="exportKind"]:checked').val() || exportCtx.kind || 'BOTH';
            var target = $('#exportDialect').val() || '';
            var body = {
                kind: kind,
                targetDbType: target,
                tables: exportCtx.tables,
                includeDrop: $('#exportIncludeDrop').is(':checked')
            };
            if (exportCtx.mode === 'rows' && exportCtx.rows) {
                body.kind = 'DML';
                body.rows = exportCtx.rows;
            }
            $('#btnDoExport').prop('disabled', true).text('导出中...');
            fetch('/viewer/export/' + currentDsId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(function(res) {
                var ct = res.headers.get('content-type') || '';
                if (!res.ok || ct.indexOf('application/json') >= 0) {
                    return res.json().then(function(j) { throw new Error((j && j.msg) || '导出失败'); });
                }
                var disp = res.headers.get('content-disposition') || '';
                var fileName = 'export.sql';
                var m = /filename\*=UTF-8''([^;]+)|filename="([^"]+)"/i.exec(disp);
                if (m) fileName = decodeURIComponent((m[1] || m[2] || fileName).replace(/"/g, ''));
                return res.blob().then(function(blob) {
                    return { blob: blob, fileName: fileName };
                });
            }).then(function(pack) {
                var url = URL.createObjectURL(pack.blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = pack.fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                closeExportModal();
                showToast('已开始下载 ' + pack.fileName, 'success');
            }).catch(function(err) {
                showToast(err.message || '导出失败', 'warning');
            }).then(function() {
                $('#btnDoExport').prop('disabled', false).text('下载 .sql');
            });
        }
    </script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app-version.js}"></script>
</body>
</html>
